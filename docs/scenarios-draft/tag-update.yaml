# [초안·미적용 — 기록용] 리소스 태그 수정 시나리오. 앱은 이 폴더를 읽지 않는다(사용자 지시 2026-11-06: 기록만 해 둔다).
# 쓰려면 사용자 검토(대상 지정 방식, 다룰 리소스 종류, 삭제 포함 여부, IaC 코드 수정 step 필수 여부)를 거쳐 knowledge/scenarios/로 옮기고 평가 케이스를 추가한다.
# 규격: knowledge/scenarios/SCHEMA.md
# 현재 지식 문서(`knowledge/cli/aws/ec2/tags.md`)가 EC2 계열 리소스의 describe-tags·create-tags만 다루므로 이 시나리오도 EC2 계열(인스턴스, 보안 그룹, 볼륨, 서브넷 등)로 한정한다.
# 다른 서비스(S3, IAM, EKS, ASG) 태그와 태그 삭제는 문서가 생기면 넓힌다(그 요청은 일반 흐름으로 간다).
# 이 파일은 사람이 검토해 두는 골격이다. 게이트·필수 항목(expect)을 바꾸려면 사용자 검토가 필요하다.
id: tag-update
title: 리소스 태그 수정
summary: "{resource} 등 EC2 계열 리소스의 태그를 수정한다(현재 태그 확인 → 변경 → 확인, IaC 동기화는 서버가 안내)."

match:
  services_any: [ec2]
  all_of:
    - [태그, tag]
    - [수정, 변경, 추가, 붙, 달아, 적용, 바꿔, 바꾸, 설정, update, add, set]
  none_of: [조회만, 목록만, 삭제, 제거, 지워, 삭제해]

params:
  # 대상이 요청에 명시되지 않은 변경은 되물어야 하므로(일반 흐름에서) 대상 리소스가 요청에 있을 때만 시나리오를 쓴다.
  resource:
    required: true
    patterns: ['(<(?:INSTANCE|SG|SGR|VPC|SUBNET|AMI|ENI|RTB|IGW|VOLUME|SNAPSHOT|NAT|EIP)_\d+>)']
  tag_key:
    patterns: ['\b([A-Za-z][\w:./-]*)\s*=\s*\S', '\b([A-Za-z][\w:./-]*)\s*태그']

investigation:
  - aws ec2 describe-tags --filters Name=resource-id,Values={resource}
  - aws ec2 describe-tags --filters Name=key,Values={tag_key}

phases:
  - id: target-check
    title: 대상과 현재 태그 확인
    purpose: 태그를 바꿀 대상 리소스와 현재 태그(키·값)를 확인하고 시스템이 쓰는 태그인지 점검한다.
    rollback: 읽기 전용 phase라 롤백이 필요 없다.
    guidance: |
      읽기 전용 phase다. 위 조사 결과를 근거로 대상 리소스의 현재 태그를 확인하는 step을 만든다(`aws ec2 describe-tags --filters Name=resource-id,Values=<대상>`).
      바꿀 키가 시스템이나 다른 도구가 쓰는 태그(`aws:` 접두사, `kubernetes.io/cluster/...`, `k8s.io/cluster-autoscaler/...`, `eks:`)이거나 IAM 조건·비용 배분에 쓰일 수 있으면 그 사실을 확인 step의 checklist에 적고,
      대상이나 키·값이 요청에 분명하지 않으면 추측하지 말고 `request_clarification`으로 묻는다. 확인 단계에서 본 이전 값은 롤백에 쓰므로 checklist에 기록하라고 적는다.
    docs: ["aws ec2 describe-tags"]
    expect:
      - ["describe-tags"]

  - id: tag-update
    title: 태그 수정
    purpose: 요청한 태그를 대상 리소스에 적용한다.
    rollback: 확인 단계에서 기록한 이전 값으로 `aws ec2 create-tags`를 다시 적용한다(같은 키는 덮어쓴다). 새로 추가한 키의 삭제는 문서에 명령이 없어 사람이 수행한다.
    guidance: |
      `aws ec2 create-tags --resources <대상> --tags Key=<키>,Value=<값>`으로 적용한다. 같은 키가 있으면 값이 덮어써진다. 대상·키·값은 요청과 조사 결과에 있는 것만 쓰고 지어내지 않는다.
      대상이 여러 개면 한 명령의 `--resources`에 모아도 되고, 변경 step마다 확인 step(`describe-tags`, `check_for`)을 둔다.
    docs: ["aws ec2 create-tags"]
    expect:
      - ["create-tags"]

  - id: verify
    title: 변경 확인
    purpose: 태그가 의도대로 적용됐는지 확인한다.
    rollback: 읽기 전용 phase라 롤백이 필요 없다.
    guidance: |
      `aws ec2 describe-tags`로 대상의 태그가 의도한 키·값인지 확인한다. Terraform 등 코드로 관리하는 리소스라면 코드의 태그 값도 같이 바꿔야 한다는 점을 checklist 항목으로 적는다
      (`iac_managed`이면 코드 동기화 step은 서버가 자동으로 더한다).
    docs: ["aws ec2 describe-tags"]
    expect:
      - ["describe-tags"]
