<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevOps Plan/Apply</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--muted:#667085;--line:#d9dde4;--accent:#2457c5;--ok:#1f7a3d;--warn:#a15c00;--bad:#b42318;--code:#f0f2f5;--agent:#1d4ed8;--agentbg:#e7efff;--manual:#b45309;--manualbg:#fff0d9}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1a1f28;--fg:#e6e9ef;--muted:#98a2b3;--line:#2c3441;--accent:#7aa2ff;--ok:#5cc47f;--warn:#e0a458;--bad:#ff7b72;--code:#232a35;--agent:#8fb0ff;--agentbg:#1f2c4d;--manual:#f0b25a;--manualbg:#3d2d14}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
h1{font-size:15px;margin:0}h2{font-size:14px;margin:0 0 6px}h3{font-size:13px;margin:0}
#shell{display:grid;grid-template-columns:260px minmax(0,1fr) 370px;height:100vh}
#left,#center,#chat{overflow:auto;min-height:0}
#left{background:var(--card);border-right:1px solid var(--line);padding:10px}
#center{padding:12px 14px}
#right{display:flex;flex-direction:column;min-height:0;background:var(--card);border-left:1px solid var(--line)}
#chat{flex:1;padding:10px 12px}
#composer{border-top:1px solid var(--line);padding:8px 12px}
#tabs{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:11px}
.badge{display:inline-block;padding:0 6px;border-radius:9px;border:1px solid var(--line);font-size:11px;line-height:17px;white-space:nowrap}
.b-ok{color:var(--ok);border-color:var(--ok)}.b-warn{color:var(--warn);border-color:var(--warn)}.b-bad{color:var(--bad);border-color:var(--bad)}.b-acc{color:var(--accent);border-color:var(--accent)}.b-man{color:var(--manual);border-color:var(--manual)}
.actor{font:600 10px ui-monospace,Consolas,monospace;padding:1px 5px;border-radius:3px;letter-spacing:.02em;white-space:nowrap}
.actor.agent{color:var(--agent);background:var(--agentbg)}.actor.manual{color:var(--manual);background:var(--manualbg)}
button{font:inherit;font-size:12px;padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad);border-color:var(--bad)}
button.small{padding:1px 7px;font-size:11px}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{font:inherit;font-size:12px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);max-width:100%}
textarea{width:100%;min-height:54px}
pre,code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
pre{background:var(--code);padding:6px 8px;border-radius:6px;overflow:auto;max-height:240px;margin:5px 0;white-space:pre-wrap;word-break:break-all}
.toast{position:fixed;right:14px;bottom:14px;background:var(--fg);color:var(--bg);padding:7px 11px;border-radius:6px;max-width:80vw;z-index:9;font-size:12px}
.banner{padding:5px 9px;border-radius:6px;margin:0 0 10px;background:var(--code)}
ul{margin:3px 0;padding-left:18px}
label{display:block}
/* 좌측 */
.hitem{display:flex;gap:4px;align-items:flex-start;border-radius:6px;padding:5px;cursor:pointer}
.hitem:hover,.hitem.active{background:var(--code)}
.hmain{flex:1;min-width:0}
.htitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hitem .x{border:none;background:none;color:var(--muted);padding:0 4px;font-size:15px}
.sec{margin:12px 4px 5px;font-size:11px;color:var(--muted);font-weight:600}
/* 이력: 한 줄 + 오른쪽 끝 상태 점 */
.hline{display:flex;align-items:center;gap:6px;border-radius:6px;padding:5px 6px;cursor:pointer}
.hline:hover,.hline.active{background:var(--code)}
.hline .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hline .x{border:none;background:none;color:var(--muted);padding:0 3px;font-size:14px;visibility:hidden}
.hline:hover .x{visibility:visible}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.plan{background:#e0a800}.dot.live{background:#22a447;animation:blink 1.1s ease-in-out infinite}.dot.livewait{background:#e0a800;animation:blink 1.1s ease-in-out infinite}
.dot.paused{background:#e8590c}.dot.done{background:#2f6fde}.dot.aborted{background:#8a919e}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin:2px 4px}
/* 절차 줄의 승인(체크)·실행(액션) 아이콘 */
.ico{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 3px;border-radius:5px;border:1px solid var(--line);background:var(--card);font-size:13px;line-height:1;color:var(--fg)}
button.ico{cursor:pointer}
button.ico:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.ico.ok{color:var(--ok);border-color:var(--ok)}.ico.bad{color:var(--bad);border-color:var(--bad)}.ico.run{color:var(--accent);border-color:var(--accent)}.ico.mute{color:var(--muted)}
.ico.act{color:var(--accent);border-color:var(--accent)}
.icos{display:inline-flex;gap:3px;flex:none}
/* 실행 로그: 터미널 형태 */
.termwrap{margin-top:10px}
.term{display:flex;flex-direction:column-reverse;max-height:340px;overflow:auto;background:#0d1117;color:#c9d1d9;border-radius:6px;border:1px solid #30363d}
.term-in{padding:8px 10px;font:11.5px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.term-h{color:#8b949e;margin-top:8px}.term-h:first-child{margin-top:0}.term-cmd{color:#7ee787}.term-out{color:#c9d1d9}.term-err{color:#ff7b72}.term-ok{color:#3fb950}.term-bad{color:#ff7b72}
/* 중앙 */
.ctabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 10px}
.ctab{border:none;border-bottom:2px solid transparent;border-radius:0;padding:5px 14px;background:none;font-size:13px}
.ctab.on{border-bottom-color:var(--accent);color:var(--accent);font-weight:600}
.phase{margin:12px 0 0}.phase>.head{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);padding-bottom:3px}
.srow{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 7px;margin:5px 0 0;background:var(--card);cursor:pointer;font-size:12.5px}
.srow.sel{border-color:var(--accent)}
.srow.over{border-top:3px solid var(--accent)}
.srow.s-done{border-left:4px solid var(--ok)}.srow.s-failed{border-left:4px solid var(--bad)}.srow.s-running,.srow.s-approved,.srow.s-awaiting_report,.srow.s-awaiting_confirm{border-left:4px solid var(--accent)}
.grip{cursor:grab;color:var(--muted);user-select:none;padding:0 2px}
.stitle{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{border:1px solid var(--accent);border-top:none;border-radius:0 0 6px 6px;padding:7px 9px;margin:0 0 3px;background:var(--card)}
.dropend{height:12px}.dropend.over{border-top:3px solid var(--accent)}
.legend{display:flex;gap:10px;align-items:center;margin:2px 0 6px}
/* 우측 대화 */
.bubble{border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:0 0 8px;max-width:94%}
.bubble.user{margin-left:auto;background:var(--code)}
.pane-title{font-weight:600;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1000px){
#shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
#tabs{display:flex;border-bottom:1px solid var(--line);background:var(--card)}
#tabs button{flex:1;border:none;border-radius:0;padding:9px;font-size:13px}
#tabs button.on{border-bottom:2px solid var(--accent);color:var(--accent)}
#left,#center,#right{display:none;border:none}
#shell.tab-left #left,#shell.tab-center #center{display:block}
#shell.tab-right #right{display:flex}
}
</style>
</head>
<body>
<div id="shell" class="tab-center">
  <div id="tabs"><button data-tab="left">작업</button><button data-tab="center">절차</button><button data-tab="right">대화</button></div>
  <aside id="left"></aside>
  <main id="center"></main>
  <section id="right"><div id="chat"></div><footer id="composer"></footer></section>
</div>
<script>
"use strict";
// ---- 작은 DOM 도우미: 데이터는 항상 텍스트 노드로만 넣는다(모델·실행 출력에 HTML이 있어도 해석되지 않는다) ----
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const $shell = document.getElementById("shell"), $left = document.getElementById("left"), $center = document.getElementById("center"),
      $chat = document.getElementById("chat"), $comp = document.getElementById("composer");

const LABEL = {
  state: {draft:"계획 생성 전", plan_review:"plan 검토", plan_approved:"plan 승인됨", applying:"apply 진행", paused:"일시정지", completed:"완료", aborted:"중단됨"},
  step: {pending:"대기", approved:"승인됨", running:"실행 중", awaiting_report:"실행 완료 보고 대기", awaiting_confirm:"확인 대기", done:"완료", failed:"실패", skipped:"건너뜀", aborted:"중단됨"},
  op: {read:"읽기", mutate:"변경", manual:"수동 실행", none:"실행 없음"},
  kind: {cli:"CLI", manual:"수동", iac:"IaC", check:"체크", poll:"폴링"},
  risk: {low:"위험 낮음", medium:"위험 중간", high:"위험 높음"},
  flag: {open_cidr:"전체 개방(0.0.0.0/0)", wide_cidr:"넓은 CIDR", wildcard_principal:"와일드카드 Principal", wildcard_action:"와일드카드 Action", admin_policy:"관리자 정책",
    recursive_delete:"재귀 삭제", sync_delete:"sync --delete", delete_all:"전체 삭제", namespace_delete:"네임스페이스 삭제", public_access_relax:"퍼블릭 접근 완화",
    public_acl:"공개 ACL", multiple_targets:"다중 대상", prod_target:"prod 대상", fallback:"문서 근거 없음", unknown_impact:"영향 불명", iac_drift:"IaC 코드와 어긋날 수 있음",
    scale_to_zero:"replicas=0", policy_unreadable:"정책 파일을 읽을 수 없음", user_data_script:"user-data 스크립트", negated_element:"NotAction/NotResource 등 부정 요소"},
  req: {open_cidr_confirm:"전체 개방: 요청자의 사유 입력 + 다른 사람의 확인", strong_warning:"강한 경고: 다른 사람의 확인", dry_run_first:"같은 명령의 dry-run을 먼저 실행해야 함",
    prod_warning:"prod 대상: 다른 사람의 확인", fallback_approval:"AI 추정: 다른 사람의 승인", show_file_contents:"파일 내용 확인: 다른 사람의 확인"},
  code: {requester_cannot_approve_plan:"요청자는 plan을 승인할 수 없습니다.", requester_cannot_approve_change:"요청자는 변경 step을 승인할 수 없습니다.",
    plan_hash_mismatch:"화면의 plan과 서버의 plan이 다릅니다. 새로 고침하세요.", stale_plan_version:"더 새로운 plan 버전이 있습니다.", not_a_participant:"참여자가 아닙니다.",
    gate_not_approved:"게이트 승인이 필요합니다.", previous_phase_incomplete:"앞 phase가 끝나지 않았습니다.", state_check_required:"적용됐을 수 있어 상태 확인 보고가 필요합니다.",
    retry_limit_reached:"재시도 횟수 상한에 도달했습니다.", requester_cannot_skip:"요청자는 건너뛸 수 없습니다.", requester_cannot_confirm:"요청자는 이 항목을 확인할 수 없습니다.",
    report_by_requester_only:"요청자만 실행 완료를 보고할 수 있습니다.", requester_cannot_confirm_report:"요청자는 보고를 확인할 수 없습니다.", checklist_incomplete:"체크리스트를 모두 표시해야 합니다.",
    plan_edit_not_allowed:"apply 중에는 수정할 수 없습니다. 먼저 일시정지하세요.", plan_invalid:"수정한 계획이 검증을 통과하지 못했습니다.", input_rejected:"입력이 차단되었습니다.",
    internal_error:"서버 오류가 발생했습니다.", message_too_large:"메시지가 너무 큽니다.", title_required:"작업 제목을 입력하세요.", invite_by_requester_only:"초대 링크는 요청자만 만들 수 있습니다.",
    answer_by_requester_only:"요청자만 답할 수 있습니다.", answer_not_expected:"지금은 답을 받지 않습니다.", conversation_too_long:"대화가 길어졌습니다. 새 작업으로 시작하세요.",
    missing_check:"변경 명령에는 확인(읽기) 명령이 필요합니다.", blocked_command:"명령 가드가 막은 명령입니다.", unknown_or_forward_reference:"순서나 참조가 맞지 않습니다.",
    duplicate_step_id:"같은 id의 절차가 있습니다.", input_blocked:"입력이 차단되었습니다(비밀값·지시문 등).", locked_step_changed:"완료된 절차는 바꿀 수 없습니다.",
    locked_step_removed:"완료된 절차는 지울 수 없습니다.", locked_step_reordered:"완료된 절차의 순서는 바꿀 수 없습니다.", locked_step_moved:"완료된 절차는 옮길 수 없습니다.",
    retry_by_requester_only:"요청자만 다시 시도할 수 있습니다.", retry_not_expected:"지금은 다시 시도할 수 없습니다(중단된 작업만 가능).", confirm_not_allowed:"이 절차는 확인만으로 진행할 수 없습니다(승인이 필요합니다)."},
};
const lab = (map, k) => LABEL[map][k] || k;
const codeText = c => { const base = String(c).split(":")[0]; return LABEL.code[c] || LABEL.code[base] || c; };
// 실행 주체: 서버(에이전트)가 실행하면 AGENT, 사람이 자기 터미널·코드에서 하면 MANUAL
const actorOf = s => (s.op === "read" || s.op === "mutate") ? "AGENT" : "MANUAL";
const OPCLASS = {read:"b-ok", mutate:"b-bad", manual:"b-man", none:"b-man"};

// ---- 상태 ----
// 브라우저에는 자격(세션 id, 닉네임, 멤버 토큰)만 둔다. 제목·상태·결과 같은 이력의 내용은 모두 서버 DB에서 읽는다.
// 이 탭이 보고 있는 항목은 sessionStorage에 둔다(탭마다 다른 닉네임으로 같은 서버를 열어 4-eyes를 확인할 수 있게).
const S = { sid:null, token:null, nick:null, ws:null, view:null, pending:null, drafts:{}, conn:"끊김", newTask:false, history:[], sel:null, tab:"center", ctab:"plan",
            invite:null, addAt:null, busy:false, drag:null, lastHist:0, autoOff:false, act:{} };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  sget(k) { try { return JSON.parse(sessionStorage.getItem(k) || "null"); } catch { return null; } },
  sset(k, v) { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function creds() {
  const l = store.get("creds", null);
  if (l) return l;
  return store.get("hist", []).map(e => ({sid:e.sid, nick:e.nick, token:e.token}));       // 이전 버전의 저장 형식에서 이어받기
}
function addCred(c) { store.set("creds", [c, ...creds().filter(x => !(x.sid === c.sid && x.nick === c.nick))].slice(0, 50)); }
function dropCred(sid, nick) { store.set("creds", creds().filter(x => !(x.sid === sid && x.nick === nick))); }
function toast(msg) { const t = h("div", {class:"toast"}, msg); document.body.append(t); setTimeout(() => t.remove(), 5000); }

// ---- 통신 ----
async function api(path, body) {
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const d = j.detail || {}; throw new Error(d.message || codeText(d.code || r.status)); }
  return j;
}
async function loadHistory() {
  const items = creds();
  if (!items.length) { S.history = []; return renderLeft(); }
  try {
    const r = await api("/api/history", {items:items.map(c => ({sid:c.sid, token:c.token}))});
    const gone = r.items.filter(i => !i.valid).map(i => i.sid);
    if (gone.length) store.set("creds", creds().filter(c => !gone.includes(c.sid)));      // 서버에 없는 세션의 자격은 지운다
    S.history = r.items.filter(i => i.valid).map(i => ({...i, token:(items.find(c => c.sid === i.sid && c.nick === i.nick) || {}).token}));
  } catch { /* 서버에 닿지 않으면 이전 목록을 둔다 */ }
  renderLeft();
}
function closeWs() { if (S.ws) { try { S.ws.onclose = null; S.ws.close(); } catch {} } S.ws = null; }
function openSession(c) {
  closeWs();
  Object.assign(S, {sid:c.sid, token:c.token, nick:c.nick, view:null, pending:null, conn:"연결 중", newTask:false, sel:null, invite:null, addAt:null, autoOff:false, ctab:"plan"});
  store.sset("active", {sid:c.sid, nick:c.nick});
  connect(); render();
}
function startNewTask() {
  closeWs();
  Object.assign(S, {sid:null, token:null, nick:null, view:null, pending:null, newTask:true, sel:null, invite:null, addAt:null, tab:"center", ctab:"plan"});
  store.sset("active", null); render();
}
function connect() {
  const sid = S.sid;
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/" + sid);
  S.ws = ws; S.conn = "연결 중";
  ws.onopen = () => ws.send(JSON.stringify({type:"auth", token:S.token}));
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "view") { S.conn = "연결됨"; setView(m.data); }
    else if (m.type === "result") {
      if (m.invite) { S.invite = location.origin + "/?s=" + S.sid + "&i=" + m.invite; renderCenter(); }
      if (!m.ok) toast(codeText(m.code) + (m.message ? " — " + m.message : "") + (m.codes ? " (" + m.codes.slice(0, 3).map(codeText).join(", ") + ")" : ""));
    }
  };
  ws.onclose = ev => {
    if (S.sid !== sid) return;
    S.conn = "끊김";
    if (ev.code === 4401) toast("인증에 실패했습니다. 왼쪽 이력에서 지우고 다시 참여하세요.");
    else setTimeout(() => S.sid === sid && connect(), 2000);
    render();
  };
}

    h("div", {class:"row"}, h("button", {class:"primary", onclick: () => send({type:"report_done", version:v.version, step:s.id, text:ta.value, checked:boxes.map((b, i) => b.checked ? i : -1).filter(i => i >= 0)})}, "실행 완료 보고"),
      h("button", {class:"danger", onclick: () => send({type:"report_failed", version:v.version, step:s.id, text:ta.value})}, "실패 보고")));
}
function confirmBox(v, s) {
  const rep = (v.outputs || []).filter(o => o.step_id === s.id && o.status === "reported").pop();
  const key = "note:" + s.id, note = h("input", {placeholder:"(선택) 메모", value:S.drafts[key] || ""});
  note.addEventListener("input", () => S.drafts[key] = note.value);
  return h("div", {style:"width:100%"}, rep ? h("pre", {}, "요청자의 보고:\n" + rep.text) : h("div", {class:"small muted"}, "요청자가 결과를 붙여넣지 않았습니다."),
    h("div", {class:"row"}, note, h("button", {class:"primary", onclick: () => send({type:"confirm_report", version:v.version, step:s.id, accept:true, note:note.value})}, "확인(완료)"),
      h("button", {class:"danger", onclick: () => send({type:"confirm_report", version:v.version, step:s.id, accept:false, note:note.value})}, "거절(다시 보고)")));
}
function failureView(v, s) {
  let a = null;
  for (const e of (v.events || []).slice().reverse()) if (e.kind === "failure_analysis") { try { const x = JSON.parse(e.detail); if (x.step === s.id) { a = x; break; } } catch {} }
  const out = (v.outputs || []).filter(o => o.step_id === s.id).pop();
  const kids = [h("div", {class:"banner"}, h("b", {}, "실패했습니다. 재시도, 건너뛰기, 중단 중에서 고르세요."), out ? h("div", {class:"small"}, "분류: " + (out.hint || "알 수 없음")) : null,
    v.analyzing === s.id ? h("div", {class:"small"}, "답변을 생성 중입니다… 실패 원인을 분석하고 있습니다(오른쪽 대화에 표시됩니다).") : null,
    a ? h("div", {class:"small"}, h("div", {}, "AI 분석(참고용): " + (a.cause || "")), h("div", {}, "추천(서버 규칙으로 좁힘): " + a.recommendation + (a.adjustments && a.adjustments.length ? " — " + a.adjustments.join(", ") : "")),
      a.needs_state_check ? h("div", {}, "적용됐을 수 있어 재시도 전에 상태 확인이 필요합니다.") : null) : null)];
  if (v.session.state === "paused") {
    const chk = h("input", {type:"checkbox"});
    kids.push(h("div", {class:"row"}, h("label", {}, chk, " 상태를 확인했습니다(적용되지 않았음을 확인)"),
      h("button", {onclick: () => send({type:"decide", version:v.version, step:s.id, choice:"retry", state_checked:chk.checked})}, "재시도"),
      h("button", {onclick: () => send({type:"decide", version:v.version, step:s.id, choice:"skip"})}, "건너뛰기"),
      h("button", {class:"danger", onclick: () => send({type:"decide", version:v.version, step:s.id, choice:"abort"})}, "중단")));
  }
  return h("div", {}, kids);
}
function logPanel(v) {         // 활동 로그는 접어 둔다
  return h("details", {class:"card"}, h("summary", {class:"small muted"}, "활동 로그 (최근 " + (v.events || []).length + "건)"), h("ul", {class:"small"}, (v.events || []).slice().reverse().map(e =>
    h("li", {}, new Date(e.ts * 1000).toLocaleTimeString() + " · " + (e.nick || "서버") + " · " + e.kind + (e.detail ? " · " + e.detail.slice(0, 120) : "")))),
    h("div", {class:"small muted"}, "승인 기록: " + (v.approvals || []).map(a => a.kind + ":" + a.target + "(" + a.nick + ")").join(", ")));
}

// ---- 우측: 이 작업의 대화(프롬프트·추가 정보·실패 분석). 작업마다 따로이다 ----
function renderChat() {
  keep($chat, () => {
    const v = S.view, kids = [h("div", {class:"pane-title", title:"이 작업의 대화입니다. 다른 작업은 ＋ 새 작업에서 시작하세요."}, "대화 · " + (S.sid ? (v ? (v.session.title || "(제목 없음)") : "…") : "새 작업"))];
    if (!S.sid) {
      kids.push(h("div", {class:"bubble"}, h("div", {class:"small muted"}, "에이전트"),
        S.newTask ? "어떤 작업을 하시겠어요? 가운데에서 제목을 정하고, 아래 입력창에 작업을 설명해 주세요. 필요한 정보가 있으면 여기서 물어봅니다." : "왼쪽에서 작업을 고르거나 ‘＋ 새 작업’을 시작하세요."));
    } else if (!v) kids.push(h("div", {class:"banner"}, "연결 중입니다…"));
    else {
      for (const m of (v.thread || [])) kids.push(h("div", {class:"bubble " + (m.role === "user" ? "user" : "bot")}, h("div", {class:"small muted"}, m.role === "user" ? "요청" : "에이전트"), h("div", {style:"white-space:pre-wrap"}, m.text)));
      const p = v.pipeline;
      if (v.session.state === "draft" && p && p.status === "generating") kids.push(h("div", {class:"bubble"}, h("div", {class:"small muted"}, "에이전트"), "답변을 생성 중입니다… 절차를 만들고 있습니다(문서를 찾아 근거를 확인하는 중, 1~3분)."));
      if (v.analyzing) kids.push(h("div", {class:"bubble"}, h("div", {class:"small muted"}, "에이전트"), "답변을 생성 중입니다… 절차 " + v.analyzing + "의 실패 원인을 분석하고 있습니다."));
      if (p && p.interpretations && p.interpretations.length) kids.push(h("div", {class:"small muted"}, h("b", {}, "모호한 표현을 이렇게 해석했습니다: "),
        p.interpretations.map(i => h("div", {}, "· " + i.alias + " → " + i.choice + (i.evidence ? " (근거: “" + i.evidence + "”)" : "")))));
    }
    $chat.replaceChildren(...kids);
  });
}
// 입력창: 새 작업이면 요청(제목은 가운데에서), 되묻기·중단·거절 뒤이면 같은 세션에서 이어서 답한다
function renderComposer() {
  $comp.replaceChildren();
  if (!S.sid && !S.newTask) return;
  const v = S.view, ta = h("textarea", {rows:3, maxlength:2000}), key = "composer:" + (S.sid || "new");
  ta.value = S.drafts[key] || "";
  ta.addEventListener("input", () => S.drafts[key] = ta.value);
  let mode = "new", hint = "하고 싶은 작업을 설명해 주세요. 예) dev-main 클러스터를 1.35에서 1.36으로 업그레이드하는 계획을 세워줘", enabled = true;
  if (S.sid) {
    const p = v && v.pipeline, you = v && v.you;
    if (!v) { enabled = false; hint = "연결 중입니다…"; }
    else if (v.session.state === "draft" && p && p.status === "generating") { enabled = false; hint = "답변을 생성 중입니다… 1~3분쯤 걸립니다."; }
    else if (v.session.state === "draft" && p && ["clarify", "stopped", "reject"].includes(p.status)) {
      mode = "answer";
      if (you.role !== "requester") { enabled = false; hint = "요청자가 답할 때까지 기다리는 중입니다."; }
      else hint = (p.status === "clarify" ? "위 질문에 대한 답을 이어서 적어 주세요." : p.status === "stopped" ? "내용을 보태서 다시 요청하거나, 오른쪽의 ‘다시 시도’를 누르세요." : "내용을 보태서 다시 요청해 주세요.") + " (이 작업의 추가 정보만 입력하세요. 다른 작업은 왼쪽의 ＋ 새 작업에서 시작합니다.)";
    } else { mode = "none"; enabled = false; hint = v.analyzing ? "답변을 생성 중입니다…" : "가운데의 절차 목록에서 검토·수정·승인하세요. 새 요청은 왼쪽의 ‘＋ 새 작업’에서 시작합니다."; }
  }
  ta.setAttribute("placeholder", hint);
  if (!enabled) ta.setAttribute("disabled", "");
  const go = async () => {
    if (!ta.value.trim() || S.busy) return;
    if (mode === "answer") { send({type:"answer", text:ta.value}); S.drafts[key] = ""; ta.value = ""; return; }
    const title = (S.drafts.title || "").trim(), nick = (S.drafts.nick || store.get("nick", "")).trim();
    if (!title) { toast("가운데에서 작업 제목을 먼저 입력하세요."); const t = document.getElementById("newtitle"); if (t && t.focus) t.focus(); return; }
    if (!nick) { toast("닉네임을 입력하세요."); return; }
    S.busy = true;
    try {
      const r = await api("/api/sessions", {nick, title, request:ta.value, iac_managed:!!S.drafts.iac});
      store.set("nick", nick); S.drafts[key] = ""; S.drafts.title = ""; S.drafts.iac = false;
      const c = {sid:r.session_id, nick, token:r.member_token}; addCred(c); S.invite = location.origin + r.join_path; openSession(c); S.tab = "right"; loadHistory();
    } catch (e) { toast(e.message); } finally { S.busy = false; }
  };
  ta.addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); go(); } });
  const canRetry = mode === "answer" && enabled && v.pipeline.status === "stopped";
  $comp.append(h("div", {class:"row", style:"align-items:flex-end;flex-wrap:nowrap"}, h("div", {style:"flex:1"}, ta),
    h("div", {class:"row", style:"flex-direction:column;align-items:stretch;gap:4px"}, h("button", {class:"primary", disabled:!enabled, onclick:go}, mode === "answer" ? "답하기" : "보내기"),
      canRetry ? h("button", {onclick: () => send({type:"retry_generation"})}, "다시 시도") : null)),
    h("div", {class:"small muted"}, "Enter로 보내기, Shift+Enter로 줄바꿈"));
}

// ---- 시작 ----
for (const b of document.querySelectorAll("#tabs button")) b.addEventListener("click", () => { S.tab = b.getAttribute("data-tab"); render(); });
const act = store.sget("active"), found = act && creds().find(x => x.sid === act.sid && x.nick === act.nick);
if (found) openSession(found); else render();
loadHistory();
</script>
</body>
