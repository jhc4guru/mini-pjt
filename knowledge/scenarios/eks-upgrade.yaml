# EKS 클러스터 버전 업그레이드 시나리오 (D-72). 규격: knowledge/scenarios/SCHEMA.md
# 운영 환경 전제(SERVICE.md 3-3): 노드는 ASG 기반 self-managed, 인프라(컨트롤 플레인·애드온·노드 ASG)는 Terraform 주도.
# 사용자 검토(2026-11-06) 반영: AMI·애드온 버전은 사람이 코드에 직접 지정한다(에이전트가 조회하지 않는다). 상태·버전 확인은 kubectl 우선이고
# kubectl로 볼 수 없는 것(업그레이드 인사이트, ASG 정보)만 aws를 쓴다. 노드 교체는 새 ASG 생성 → cordon → drain → 기존 ASG 축소다.
# 이 파일은 사람이 검토해 두는 골격이다. 게이트 위치, 되돌릴 수 없음 안내, 필수 항목(expect)을 바꾸려면 사용자 검토가 필요하다.
id: eks-upgrade
title: EKS 클러스터 버전 업그레이드
summary: "{cluster} 클러스터를 {to_version}으로 업그레이드한다(컨트롤 플레인 → 애드온 → self-managed 노드 교체, 변경은 Terraform)."

match:
  services_any: [eks]
  all_of:
    - [업그레이드, upgrade]
    - [클러스터, cluster, eks]
  none_of: [조회만, 가능한 버전, 삭제, 롤백]

params:
  cluster: {placeholder: CLUSTER, required: true}
  asg: {placeholder: ASG}
  to_version:
    required: true
    patterns: ['(?:에서|→|->|\bto\b)\s*v?(\d+\.\d+)', 'v?(\d+\.\d+)\s*(?:으로|로)\b']
  from_version:
    patterns: ['v?(\d+\.\d+)\s*(?:에서|→|->|부터)']

# 서버가 일괄 실행하는 읽기 명령(필요한 param이 없는 항목은 건너뛴다). 모두 kind read이고 명령 가드를 통과해야 한다.
investigation:
  - kubectl version
  - kubectl get nodes -o wide
  - kubectl get daemonset,deployment -n kube-system -o wide
  - kubectl get pods -n kube-system -o wide
  - kubectl get pdb --all-namespaces
  - aws eks list-insights --cluster-name {cluster}
  - aws autoscaling describe-auto-scaling-groups
  - aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names {asg}

phases:
  - id: preflight
    title: 사전 점검
    purpose: 현재 버전, 노드, 애드온, 업그레이드 인사이트를 확인해 진행 가능 여부를 판단한다.
    rollback: 읽기 전용 phase라 롤백이 필요 없다.
    guidance: |
      읽기 전용 phase다. 확인은 kubectl을 우선하고 kubectl로 볼 수 없는 것(업그레이드 인사이트, ASG)만 aws를 쓴다. 위 조사 결과를 근거로 확인 step을 만든다:
      컨트롤 플레인과 노드의 버전 차이(kubelet skew), 업그레이드 인사이트(오류·경고가 있으면 빠뜨리지 말고 해결 조치를 iac 또는 manual step으로 계획),
      kube-system 애드온(kube-proxy, CoreDNS, VPC CNI)의 현재 이미지 버전, PodDisruptionBudget, 노드 상태.
      AMI와 애드온의 목표 버전은 사람이 코드에 지정하므로 조회하지 않는다(필요하면 호환 버전 확인을 checklist 항목으로 적는다).
      이미 조사한 명령을 같은 형태로 되풀이하지 말고 필요한 보충 조회만 한다.
    docs: ["aws eks list-insights", "kubectl get", "kubectl version"]
    expect:
      - ["insight"]
      - ["kubectl get"]

  - id: control-plane-upgrade
    title: 컨트롤 플레인 업그레이드
    purpose: 컨트롤 플레인 버전을 올리고 완료를 확인한다.
    gate: true
    gate_reason: 컨트롤 플레인 버전 변경은 되돌릴 수 없다. 사전 점검 결과를 확인한 뒤 진행한다.
    preconditions: ["사전 점검 phase 완료", "인사이트 오류 해결"]
    rollback: 컨트롤 플레인은 이전 버전으로 되돌릴 수 없다. 문제가 생기면 사전 점검 기록과 IaC 이력을 근거로 복구·대응한다.
    guidance: |
      컨트롤 플레인 버전 변경은 Terraform으로 하므로 `iac` step으로 한다(코드의 버전 값 변경, PR, terraform plan 검토, apply). 이 step에는 `irreversible: true`를 표시한다.
      서버가 `aws eks update-cluster-version`을 직접 실행하지 않는다. 완료 대기와 확인은 kubectl로 한다(`kubectl version`으로 서버 버전이 {to_version}인지 확인, 오래 걸리면 poll step).
    docs: ["kubectl version", "kubectl get"]
    expect:
      - ["iac"]
      - ["kubectl version"]

  - id: addon-upgrade
    title: 애드온 업그레이드
    purpose: kube-proxy, CoreDNS, VPC CNI 등 애드온을 {to_version} 호환 버전으로 올린다(Terraform·수동 작업).
    gate: true
    gate_reason: 애드온(특히 CoreDNS, VPC CNI) 변경은 클러스터 네트워크·DNS에 영향이 있어 컨트롤 플레인 결과를 확인한 뒤 진행한다.
    preconditions: ["컨트롤 플레인 업그레이드 완료와 확인"]
    rollback: Terraform 코드의 이전 애드온 버전으로 되돌려 다시 apply한다.
    guidance: |
      애드온 버전 변경은 Terraform 코드 변경(`iac` step)과 필요한 수동 작업(`manual` step)으로 한다. 서버가 `aws eks update-addon` 같은 변경을 직접 실행하지 않는다.
      애드온 이름과 현재 버전은 조사 결과에 있는 값만 쓰고, 목표 버전은 사람이 코드에 지정하므로 지어내지 않는다(호환 버전 확인은 checklist 항목으로 적는다).
      변경 뒤에는 kubectl로 확인한다(예: `kubectl rollout status daemonset/<이름> -n kube-system --timeout=300s`, `kubectl get pods -n kube-system`).
    docs: ["kubectl rollout status", "kubectl get"]
    expect:
      - ["iac", "manual"]
      - ["kubectl"]

  - id: node-replace
    title: 노드 교체 (새 ASG, cordon·drain, 기존 ASG 축소)
    purpose: 새 버전 노드를 새 ASG로 만들고 기존 노드를 cordon·drain한 뒤 기존 ASG를 줄인다.
    gate: true
    gate_reason: 노드 교체는 Pod 축출과 인스턴스 종료를 일으킨다. 애드온 결과와 PDB를 확인한 뒤 진행한다.
    preconditions: ["애드온 업그레이드 완료와 확인", "새 노드용 AMI가 코드에 지정됨"]
    rollback: 기존 ASG를 다시 늘리고 uncordon한다. 이미 종료된 인스턴스는 되살릴 수 없다.
    guidance: |
      노드는 ASG 기반 self-managed이고 교체는 이 순서로 한다. 1) 새 launch template·ASG를 Terraform으로 만든다(`iac` step. AMI는 사람이 코드에 지정하므로 조회하지 않는다. 새 ASG에는 scale-in protection을 설정한다).
      2) 새 노드가 Ready이고 {to_version}인지 kubectl로 확인한다(오래 걸리면 poll). 3) 기존 노드를 cordon한다(`kubectl cordon`, 노드 이름은 조사 결과의 노드 목록에서 쓴다).
      4) 기존 노드를 drain한다(`kubectl drain <노드> --ignore-daemonsets --delete-emptydir-data --timeout=...`, PDB를 고려한다). 5) 기존 ASG를 줄인다(`aws autoscaling set-desired-capacity` 또는 `update-auto-scaling-group`, 대상은 {asg} 또는 조사 결과의 기존 ASG).
      기존 ASG의 인스턴스에 scale-in protection이 있어 축소가 막히면 그 해제는 문서에 있는 명령으로 할 수 있을 때만 step으로 쓰고, 없으면 manual step으로 안내한다(명령을 지어내지 않는다). 6) 축소 결과를 `aws autoscaling describe-auto-scaling-groups`와 `kubectl get nodes`로 확인한다.
      ASG 이름이 요청과 조사 결과에 없으면 `request_clarification`으로 묻는다.
    docs: ["kubectl cordon", "kubectl drain", "aws autoscaling set-desired-capacity", "aws autoscaling update-auto-scaling-group", "kubectl get"]
    expect:
      - ["iac"]
      - ["cordon"]
      - ["drain"]
      - ["set-desired-capacity", "update-auto-scaling-group"]

  - id: final-verify
    title: 최종 확인
    purpose: 컨트롤 플레인, 노드, 애드온 버전과 워크로드 상태를 확인하고 IaC 코드를 실제 상태와 맞춘다.
    rollback: 읽기 전용 phase라 롤백이 필요 없다.
    guidance: |
      읽기 전용 확인과 IaC 동기화 확인이다. kubectl로 컨트롤 플레인·노드 버전이 {to_version}인지, 모든 노드가 Ready인지, 시스템 Pod가 정상인지 확인하고 인사이트가 해결됐는지 확인한다.
      CLI로 바꾼 것이 있으면 Terraform 코드와 실제 상태가 같은지(`terraform plan` 변경 없음) 확인하는 `iac` step을 둔다.
    docs: ["kubectl get", "aws eks list-insights"]
    expect:
      - ["kubectl get nodes", "kubectl version"]
