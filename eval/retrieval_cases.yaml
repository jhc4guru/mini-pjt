  - {id: r40, q: "버킷 목록 보여줘", expect: ["aws:s3:ls", "aws:s3api:list-buckets"], tags: [syn, multi]}
  - {id: r41, q: "<BUCKET_1> 안의 파일 목록", expect: ["aws:s3:ls", "aws:s3api:list-objects-v2"], tags: [syn, multi]}
  - {id: r42, q: "버킷 하나 만들어줘", expect: ["aws:s3:mb"], tags: [colloquial]}
  - {id: r43, q: "버킷 폴더 통째로 삭제", expect: ["aws:s3:rm"], tags: [colloquial]}
  - {id: r44, q: "두 버킷 동기화", expect: ["aws:s3:sync"], tags: [syn]}
  - {id: r45, q: "버킷 정책 확인", expect: ["aws:s3api:get-bucket-policy"], tags: [syn]}
  - {id: r46, q: "버킷 퍼블릭 액세스 차단 설정 켜줘", expect: ["aws:s3api:put-public-access-block"], tags: [syn]}
  - {id: r47, q: "버킷 버저닝 켜줘", expect: ["aws:s3api:put-bucket-versioning"], tags: [syn]}
  - {id: r48, q: "버킷 암호화 설정 확인", expect: ["aws:s3api:get-bucket-encryption"], tags: [syn]}
  # ---- IAM ----
  - {id: r49, q: "<ROLE_1> 역할에 정책 연결", expect: ["aws:iam:attach-role-policy"], tags: [syn]}
  - {id: r50, q: "역할 권한 회수", expect: ["aws:iam:detach-role-policy"], tags: [syn]}
  - {id: r51, q: "새 IAM 롤 생성", expect: ["aws:iam:create-role"], tags: [syn]}
  - {id: r52, q: "<ROLE_1>에 붙은 정책 목록", expect: ["aws:iam:list-attached-role-policies"], tags: [syn]}
  - {id: r53, q: "정책 내용 확인 <POLICY_ARN_1>", expect: ["aws:iam:get-policy-version", "aws:iam:get-policy"], tags: [multi]}
  - {id: r54, q: "IAM 사용자 목록", expect: ["aws:iam:list-users"], tags: [syn]}
  - {id: r55, q: "오래된 액세스 키 점검", expect: ["aws:iam:list-access-keys"], tags: [syn]}
  - {id: r56, q: "<USER_1> 액세스 키 발급해줘", expect: ["aws:iam:create-access-key"], tags: [syn, manual]}
  - {id: r57, q: "콘솔 비밀번호 설정", expect: ["aws:iam:create-login-profile"], tags: [syn, manual]}
  # ---- kubectl ----
  - {id: r58, q: "<NAMESPACE_1> 파드 목록 조회", expect: ["kubectl:kubectl:get"], tags: [syn]}
  - {id: r59, q: "파드 로그 확인", expect: ["kubectl:kubectl:logs"], tags: [syn]}
  - {id: r60, q: "파드가 왜 안 뜨는지 상세 확인", expect: ["kubectl:kubectl:describe", "kubectl:kubectl:events"], tags: [colloquial, multi]}
  - {id: r61, q: "배포 상태 확인", expect: ["kubectl:kubectl:rollout status"], tags: [syn]}
  - {id: r62, q: "디플로이먼트 재시작", expect: ["kubectl:kubectl:rollout restart"], tags: [syn]}
  - {id: r63, q: "이전 버전으로 롤백", expect: ["kubectl:kubectl:rollout undo"], tags: [syn]}
  - {id: r64, q: "파드 수 3개로 늘려줘", expect: ["kubectl:kubectl:scale"], tags: [colloquial]}
  - {id: r65, q: "점검 전에 노드 비워줘", expect: ["kubectl:kubectl:drain"], tags: [colloquial]}
  - {id: r66, q: "노드 스케줄링 막기", expect: ["kubectl:kubectl:cordon"], tags: [syn]}
  - {id: r67, q: "파드 안에 쉘 접속", expect: ["kubectl:kubectl:exec"], tags: [syn, manual]}
  - {id: r68, q: "파드 포트를 로컬로 연결", expect: ["kubectl:kubectl:port-forward"], tags: [syn, manual]}
  - {id: r69, q: "네임스페이스 만들어줘", expect: ["kubectl:kubectl:create"], tags: [syn]}
  - {id: r70, q: "매니페스트 yaml 적용", expect: ["kubectl:kubectl:apply"], tags: [syn]}
  - {id: r71, q: "이미지 버전 바꿔서 배포", expect: ["kubectl:kubectl:set image"], tags: [colloquial]}
  - {id: r72, q: "쿠버네티스 서버 버전 확인", expect: ["kubectl:kubectl:version"], tags: [syn]}
  - {id: r73, q: "지금 어느 클러스터에 붙어 있는지", expect: ["kubectl:kubectl:config current-context"], tags: [colloquial]}
  - {id: r74, q: "노드 CPU 메모리 사용량", expect: ["kubectl:kubectl:top node"], tags: [syn]}
  # ---- 영어 ----
  - {id: r75, q: "restart the deployment", expect: ["kubectl:kubectl:rollout restart"], tags: [en]}
  - {id: r76, q: "scale deployment to 3 replicas", expect: ["kubectl:kubectl:scale"], tags: [en]}
  - {id: r77, q: "show pod logs", expect: ["kubectl:kubectl:logs"], tags: [en]}
  - {id: r78, q: "create an IAM role", expect: ["aws:iam:create-role"], tags: [en]}
  - {id: r79, q: "list s3 buckets", expect: ["aws:s3:ls", "aws:s3api:list-buckets"], tags: [en, multi]}
  - {id: r80, q: "start an instance refresh on the autoscaling group", expect: ["aws:autoscaling:start-instance-refresh"], tags: [en]}
  - {id: r81, q: "노드 상태 확인해줘", expect: ["kubectl:kubectl:get", "kubectl:kubectl:describe"], tags: [colloquial, multi]}
  - {id: r82, q: "노드 Ready 상태 보여줘", expect: ["kubectl:kubectl:get"], tags: [colloquial]}
  - {id: r83, q: "노드 상세 정보와 이벤트 확인", expect: ["kubectl:kubectl:describe"], tags: [syn]}
  - {id: r84, q: "노드 인스턴스 상태 점검 결과 확인", expect: ["aws:ec2:describe-instance-status"], tags: [syn]}
  - {id: r85, q: "서버 상태 점검 확인해줘", expect: ["aws:ec2:describe-instance-status", "aws:ec2:describe-instances"], tags: [colloquial, multi]}
  - {id: r86, q: "보안그룹을 만들면서 Name 태그도 같이 달고 싶다", expect: ["aws:ec2:create-security-group"], tags: [colloquial]}
  - {id: r87, q: "<SG_1>에 Name 태그 붙여줘", expect: ["aws:ec2:create-tags"], tags: [colloquial]}
  - {id: r88, q: "<SG_1> 태그 확인", expect: ["aws:ec2:describe-tags"], tags: [syn]}
