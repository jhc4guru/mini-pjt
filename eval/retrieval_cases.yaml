  - {id: r24, q: "EKS 클러스터 목록", expect: ["aws:eks:list-clusters"], tags: [syn]}
  - {id: r25, q: "<CLUSTER_1> 클러스터 버전 확인", expect: ["aws:eks:describe-cluster"], tags: [syn]}
  - {id: r26, q: "클러스터를 1.36으로 업그레이드", expect: ["aws:eks:update-cluster-version"], tags: [syn]}
  - {id: r27, q: "EKS 업그레이드 전에 사전 점검 인사이트 확인", expect: ["aws:eks:list-insights"], tags: [syn]}
  - {id: r28, q: "클러스터 업그레이드 진행 상태", expect: ["aws:eks:describe-update", "aws:eks:list-updates"], tags: [multi]}
  - {id: r29, q: "<CLUSTER_1> kubeconfig 설정해줘", expect: ["aws:eks:update-kubeconfig"], tags: [syn]}
  - {id: r30, q: "설치된 애드온 목록", expect: ["aws:eks:list-addons"], tags: [syn]}
  - {id: r31, q: "coredns 애드온 1.36 호환 버전 조회", expect: ["aws:eks:describe-addon-versions"], tags: [syn]}
  - {id: r32, q: "kube-proxy 애드온 업데이트", expect: ["aws:eks:update-addon"], tags: [syn]}
  - {id: r33, q: "노드 AMI 최신 권장 이미지 ID 조회", expect: ["aws:ssm:get-parameter"], tags: [syn]}
  # ---- Auto Scaling ----
  - {id: r34, q: "ASG 상태 확인 <NAME_1>", expect: ["aws:autoscaling:describe-auto-scaling-groups"], tags: [syn]}
  - {id: r35, q: "노드 롤링 교체 시작", expect: ["aws:autoscaling:start-instance-refresh"], tags: [syn]}
  - {id: r36, q: "인스턴스 리프레시 진행률", expect: ["aws:autoscaling:describe-instance-refreshes"], tags: [syn]}
  - {id: r37, q: "ASG 최대 노드 수를 늘려줘", expect: ["aws:autoscaling:update-auto-scaling-group", "aws:autoscaling:set-desired-capacity"], tags: [colloquial, multi]}
  - {id: r38, q: "희망 용량 4로 변경", expect: ["aws:autoscaling:set-desired-capacity"], tags: [syn]}
  - {id: r39, q: "AZRebalance 프로세스 중지", expect: ["aws:autoscaling:suspend-processes"], tags: [syn]}
