# 검색 평가 케이스. 질의는 마스킹된 형태(플레이스홀더)만 쓴다. 실제 값 금지.
# expect: 정답으로 인정하는 chunk id 목록(앞쪽이 가장 적합). 하나라도 상위 k에 있으면 적중.
# tags: syn(동의어·약어) en(영어) colloquial(구어) ambiguous(모호 표현) manual(서버 미실행 명령) multi(복수 정답 가능)

cases:
  # ---- EC2 보안 그룹 ----
  - {id: r01, q: "<SG_1> 인바운드 443 열어줘", expect: ["aws:ec2:authorize-security-group-ingress"], tags: [syn]}
  - {id: r02, q: "시큐리티그룹에 22번 포트 허용 추가", expect: ["aws:ec2:authorize-security-group-ingress"], tags: [syn]}
  - {id: r03, q: "방화벽 80 포트 오픈해줘", expect: ["aws:ec2:authorize-security-group-ingress"], tags: [syn, ambiguous]}
  - {id: r04, q: "sg에서 443 허용해", expect: ["aws:ec2:authorize-security-group-ingress"], tags: [syn, colloquial]}
  - {id: r05, q: "open port 8080 on the security group", expect: ["aws:ec2:authorize-security-group-ingress"], tags: [en]}
  - {id: r06, q: "보안그룹 인바운드 규칙 삭제해줘", expect: ["aws:ec2:revoke-security-group-ingress"], tags: [syn]}
  - {id: r07, q: "포트 22 닫아줘 <SG_1>", expect: ["aws:ec2:revoke-security-group-ingress"], tags: [colloquial]}
  - {id: r08, q: "SG 아웃바운드 규칙 추가", expect: ["aws:ec2:authorize-security-group-egress"], tags: [syn]}
  - {id: r09, q: "아웃바운드 허용 제거", expect: ["aws:ec2:revoke-security-group-egress"], tags: [syn]}
  - {id: r10, q: "<VPC_1>에 보안그룹 새로 만들어줘", expect: ["aws:ec2:create-security-group"], tags: [syn]}
  - {id: r11, q: "<SG_1> 보안그룹 지워줘", expect: ["aws:ec2:delete-security-group"], tags: [colloquial]}
  - {id: r12, q: "보안그룹 목록 보여줘", expect: ["aws:ec2:describe-security-groups"], tags: [syn]}
  - {id: r13, q: "<SG_1> 규칙 확인", expect: ["aws:ec2:describe-security-group-rules", "aws:ec2:describe-security-groups"], tags: [multi]}
  # ---- EC2 인스턴스·네트워크·템플릿 ----
  - {id: r14, q: "서버 목록 조회", expect: ["aws:ec2:describe-instances"], tags: [syn]}
  - {id: r15, q: "<INSTANCE_1> 중지해줘", expect: ["aws:ec2:stop-instances"], tags: [colloquial]}
  - {id: r16, q: "인스턴스 재시작", expect: ["aws:ec2:reboot-instances"], tags: [syn]}
  - {id: r17, q: "<INSTANCE_1> 켜줘", expect: ["aws:ec2:start-instances"], tags: [colloquial]}
  - {id: r18, q: "인스턴스 삭제 <INSTANCE_1>", expect: ["aws:ec2:terminate-instances"], tags: [syn]}
  - {id: r19, q: "EC2 인스턴스 새로 생성", expect: ["aws:ec2:run-instances"], tags: [syn]}
  - {id: r20, q: "VPC 목록", expect: ["aws:ec2:describe-vpcs"], tags: [syn]}
  - {id: r21, q: "서브넷 여유 IP 확인", expect: ["aws:ec2:describe-subnets"], tags: [syn]}
  - {id: r22, q: "이 보안그룹을 쓰는 리소스가 있는지 확인", expect: ["aws:ec2:describe-network-interfaces"], tags: [colloquial]}
  - {id: r23, q: "launch template 현재 AMI 확인", expect: ["aws:ec2:describe-launch-template-versions", "aws:ec2:describe-launch-templates"], tags: [en, multi]}
